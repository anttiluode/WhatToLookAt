name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Reproduce Gate 0 CI receipt
        run: python what_to_look_at.py --seeds 16 --output /tmp/gate0_ci.json
      - name: Reproduce Gate 1 CI receipt
        run: python gate1_history_graph.py --worlds 16 --output /tmp/gate1_ci.json
      - name: Reproduce Gate 2 CI receipt
        run: python gate2_confidence_budget.py --train-worlds 40 --test-worlds 24 --output /tmp/gate2_ci.json
      - name: Reproduce Gate 3 CI receipt
        run: python gate3_image_confidence.py --train-worlds 40 --validation-worlds 24 --test-worlds 24 --output /tmp/gate3_ci.json
      - name: Reproduce Gate 4 CI receipt
        run: python gate4_relation_residual_budget.py --train-worlds 50 --validation-worlds 25 --test-worlds 24 --output /tmp/gate4_ci.json
      - name: Reproduce Gate 5 CI receipt
        run: python gate5_price_of_sparse_measurements.py --train-worlds 50 --threshold-validation-worlds 25 --policy-validation-worlds 20 --test-worlds 24 --output /tmp/gate5_ci.json
